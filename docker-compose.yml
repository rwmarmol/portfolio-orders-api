# Local development database only. Tests and migrations run exclusively against this instance.
services:
  db:
    image: postgres:17-alpine
    container_name: portfolio-orders-db
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts run only on the first start, when the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
